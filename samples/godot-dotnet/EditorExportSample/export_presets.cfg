; Everything here is what a user would set in the forked editor's export dialog.
; custom_template/release is left empty because the path is absolute and
; machine-specific; the gate fills it in with the pinned template it builds.
; Left empty at export time the editor would silently pick up whatever macos.zip
; the user has installed instead.
;
; dotnet/export_backend=2 selects dn2cpp: the published IL is transpiled to C++
; and compiled into a drop-in library, and no .NET runtime is packaged.
; The macOS deployment target is deliberate: the desktop export gate proves the
; selected architecture's value reaches both CMake and the final Mach-O.

[preset.0]

name="dn2cpp-app"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="arm64"
custom_template/debug=""
custom_template/release=""
codesign/codesign=0
notarization/notarization=0
application/bundle_identifier="org.dn2cpp.editorexportsample"
application/min_macos_version_arm64="13.30"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
dotnet/export_backend=2

