; Three hard requirements the other platforms do not have:
;
;   extensions_support=true   the game ships as a wasm side module GDMono
;                             dlopen()s, and only a "dlink" build has a real dlopen
;   thread_support=false      the drop-in is built without -pthread, and Emscripten
;                             will not load such a side module into a pthread main
;   custom_template/release   upstream ships no C#-capable Web template

