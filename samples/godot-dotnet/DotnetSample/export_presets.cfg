[preset.1]

; Handshake preset: packs only the scriptless handshake scene. The project has no
; .sln, so the C# export plugin is inert and never adds the "dotnet" feature
; GDMono::should_initialize() gates on — custom_features below carries it
; explicitly. The "handshake" feature flips the feature-tagged run/main_scene
; override in project.godot, since a release template rejects scene CLI overrides.
;
; platform="macOS" is not a host constraint: --export-pack takes the pack-only
; path, which runs no can_export and so asks for no export template. Every host
; packs with these presets, and the platform here only selects the feature set.
name="handshake-pack"
platform="macOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="dotnet,handshake"
export_filter="resources"
export_files=PackedStringArray("res://handshake.tscn")
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

export/distribution_type=0
binary_format/architecture="arm64"
codesign/codesign=0
notarization/notarization=0
application/bundle_identifier="org.dn2cpp.dotnetsample.handshake"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false

[preset.2]

; Scripted-node preset: packs the default main scene plus the scripts. Same
; sln-less arrangement as the handshake preset, so the .cs files are exported
; verbatim; the release template never reads their content (source loading is
; debug-only) and only needs the paths present so the C# script resource loader
; is invoked at all. No "handshake" feature, so the default main scene applies.
name="sample-pack"
platform="macOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="dotnet"
export_filter="resources"
export_files=PackedStringArray("res://main.tscn", "res://Player.cs", "res://Probe.cs", "res://LifetimeProbe.cs", "res://MyResource.cs")
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.2.options]

export/distribution_type=0
binary_format/architecture="arm64"
codesign/codesign=0
notarization/notarization=0
application/bundle_identifier="org.dn2cpp.dotnetsample.sample"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
