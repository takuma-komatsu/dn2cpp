; Used only by `--export-pack`, so the platform named here is irrelevant. What
; matters is `export_filter`: it has to carry the .gdextension and
; .godot/extension_list.cfg into the pack, since the engine reads BOTH from res://
; at startup and a pack missing either never attempts the load at all.

[preset.0]

name="probe-pack"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.gdextension"
exclude_filter=""
export_path="build/GameExtensionProbe.zip"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="arm64"
codesign/codesign=0
notarization/notarization=0
application/bundle_identifier="org.dn2cpp.gameextensionprobe"
