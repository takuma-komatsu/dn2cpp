[preset.0]

; Same arrangement as the DM lane's "sample-pack": custom_features carries the
; "dotnet" feature GDMono::should_initialize() gates on in a template build, and
; the script is exported verbatim so the C# script resource loader is invoked at
; all.
name="gdtask-pack"
platform="macOS"
runnable=false
advanced_options=false
dedicated_server=false
custom_features="dotnet"
export_filter="resources"
export_files=PackedStringArray("res://main.tscn", "res://GDTaskProbe.cs")
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

export/distribution_type=0
binary_format/architecture="arm64"
codesign/codesign=0
notarization/notarization=0
application/bundle_identifier="org.dn2cpp.gdtasksample"
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
