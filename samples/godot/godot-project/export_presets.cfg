[preset.0]

; iOS export (gates/build-and-run-godot-ios-export.sh): generates the Xcode
; project only (export_project_only) — no archive, no .ipa, so no signing
; identity or provisioning profile is needed. The team id passes a local
; format check only (nothing is validated online), so a placeholder works for
; the unsigned project-generation + simulator path; a real device build
; replaces it in Xcode.
name="iOS"
platform="iOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/app_store_team_id="AAAAAAAAAA"
application/bundle_identifier="org.dn2cpp.godotsample"
application/export_project_only=true

[preset.1]

; Android export (the optional tail of gates/build-and-run-android-gdext.sh):
; prebuilt-template APK packaging — use_gradle_build=false injects the pck and the
; GDExtension .so into the official android_debug.apk template, so no Gradle is
; needed. Setting gradle_build/use_gradle_build true instead emits and builds a full
; Gradle project from the res://android/build template, which needs an SDK, a JDK,
; editor settings and a debug keystore on the host.
name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

gradle_build/use_gradle_build=false
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
package/unique_name="org.dn2cpp.godotsample"
