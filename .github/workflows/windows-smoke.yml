# Hosted checks run basic regressions per change and the wider suite daily.
name: windows-smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: windows-smoke-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'fast' || 'suite' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  GODOT_VERSION: 4.7.2-stable
  # Gates import vcvarsall x64 when this compiler is selected.
  CMAKE_CXX_COMPILER: cl

jobs:
  smoke:
    name: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'windows-primitives' || 'windows-suite' }}
    runs-on: windows-latest
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 30 || 240 }}
    env:
      SMOKE_PROFILE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'primitives' || 'suite' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bash and upload-artifact must resolve the same Windows-visible directory.
      - name: Resolve a Windows-visible LOGDIR
        run: echo "LOGDIR=$(cygpath -m "$RUNNER_TEMP/dn2cpp-ci-smoke")" >> "$GITHUB_ENV"

      - name: Install native toolchain
        run: choco install ninja -y

      - name: Report the Visual Studio install
        run: |
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          "$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath

      - name: Ensure shasum is on PATH
        run: |
          if command -v shasum >/dev/null 2>&1; then
            exit 0
          fi
          # Git for Windows can omit core_perl from PATH; gates use -a 256.
          shim_dir="$RUNNER_TEMP/shasum-shim"
          mkdir -p "$shim_dir"
          printf '%s\n' \
            '#!/usr/bin/env bash' \
            'if [ "$1" = "-a" ] && [ "$2" = "256" ]; then shift 2; fi' \
            'exec sha256sum "$@"' \
            > "$shim_dir/shasum"
          chmod +x "$shim_dir/shasum"
          echo "$shim_dir" >> "$GITHUB_PATH"

      # GodotSharpShim needs extension_api.json even when Godot gates are omitted.
      - name: Provision Godot ${{ env.GODOT_VERSION }}
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          asset="Godot_v${GODOT_VERSION}_win64.exe"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${asset}.zip"
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" "$url"
          unzip -q -o "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT=$(cygpath -u "$RUNNER_TEMP/godot/$asset")" >> "$GITHUB_ENV"

      - name: Confirm Godot runs headless
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: '"$GODOT" --headless --version'

      - name: Dump extension_api.json
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: '"$GODOT" --headless --dump-extension-api'

      - name: Verify smoke runner
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: ./gates/ci-smoke.sh --self-test

      - name: Run selected smoke profile
        run: |
          # Keep the heavyweight native ISA probe outside the hosted Windows suite.
          if [ "$SMOKE_PROFILE" = suite ]; then
            export DN2CPP_SKIP_PLATFORM_ISA_NATIVE=1
          fi
          ./gates/ci-smoke.sh --profile "$SMOKE_PROFILE"

      # Release inherited log handles before upload-artifact reads the logs.
      - name: Shut down dotnet build servers
        if: always()
        run: dotnet build-server shutdown

      - name: Publish gate results and timings
        if: always()
        run: |
          if [ -f "$LOGDIR/summary.md" ]; then
            cat "$LOGDIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-windows
          path: ${{ env.LOGDIR }}
          retention-days: 7
          if-no-files-found: warn
