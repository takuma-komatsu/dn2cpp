# Hosted checks run basic regressions per change and the wider suite daily.
name: macos-smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: macos-smoke-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'fast' || 'suite' }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  GODOT_VERSION: 4.7.2-stable
  LOGDIR: /tmp/dn2cpp-ci-smoke

jobs:
  smoke:
    name: ${{ matrix.partition == 'suite' && 'macos-suite' || matrix.partition == 'limits' && 'macos-transpiler-limits' || matrix.partition == 'arrays' && 'macos-arrays' || 'macos-primitives' }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '["core","arrays","limits"]' || '["suite"]') }}
    runs-on: macos-26
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 30 || 180 }}
    env:
      SMOKE_PROFILE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'primitives' || 'suite' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-dotnet also installs latest LTS runtime, defeating the oracle pin.
      - name: Install isolated exact culture reference SDK
        run: python gates/setup-culture-reference.py

      - name: Install native toolchain
        run: brew install ninja ccache

      # GodotSharpShim needs extension_api.json even when Godot gates are omitted.
      - name: Provision Godot ${{ env.GODOT_VERSION }}
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          asset="Godot_v${GODOT_VERSION}_macos.universal"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${asset}.zip"
          curl -fL --retry 3 -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo mkdir -p /Applications
          sudo cp -R /tmp/godot/Godot.app /Applications/
          sudo ln -sf /Applications/Godot.app/Contents/MacOS/Godot /usr/local/bin/godot
          godot --headless --version

      - name: Dump extension_api.json
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: godot --headless --dump-extension-api

      - name: Verify smoke runner
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: ./gates/ci-smoke.sh --self-test

      - name: Run selected smoke profile
        env:
          DN2CPP_GATE_WATCHDOG_SECS: ${{ matrix.partition == 'limits' && 1200 || '' }}
        run: |
          export TMPDIR="$RUNNER_TEMP/dn2cpp-gate-output"
          mkdir -p "$TMPDIR"
          smoke_args=(--profile "$SMOKE_PROFILE")
          if [ "$SMOKE_PROFILE" = primitives ]; then
            smoke_args+=(--partition "${{ matrix.partition }}")
          fi
          ./gates/ci-smoke.sh "${smoke_args[@]}"

      - name: Publish gate results and timings
        if: always()
        run: |
          if [ -f "$LOGDIR/summary.md" ]; then
            cat "$LOGDIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.partition == 'suite' && 'gate-logs-macos' || format('gate-logs-macos-{0}', matrix.partition) }}
          path: ${{ env.LOGDIR }}
          retention-days: 7
          if-no-files-found: warn

      # Keep byte evidence, not generated sources, build trees or executables.
      - name: Upload failed gate output evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output-macos-${{ matrix.partition }}
          path: |
            artifacts/**/*.stdout
            artifacts/**/*.stderr
            artifacts/**/*.status
            artifacts/**/*.exit
            artifacts/**/*.command
            artifacts/**/native.out
            artifacts/**/oracle.out
            artifacts/**/expected.out
            artifacts/**/dotnet.out
            artifacts/**/*-native.out
            artifacts/**/*-dotnet.out
            artifacts/**/*.raw.out
            artifacts/**/*.err
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.stdout
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.stderr
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.status
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.exit
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.command
            ${{ runner.temp }}/dn2cpp-gate-output/**/native.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/oracle.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/expected.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/dotnet.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*-native.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*-dotnet.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.raw.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.err
          retention-days: 7
          if-no-files-found: warn
