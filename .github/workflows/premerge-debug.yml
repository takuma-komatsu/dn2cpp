name: premerge-debug

on:
  workflow_call:
    inputs:
      host:
        type: string
        required: true
      expected_head:
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  premerge:
    name: ${{ inputs.host }}-premerge-debug
    runs-on: ${{ inputs.host == 'windows' && 'windows-2025-vs2026' || inputs.host == 'macos' && 'macos-26' || 'ubuntu-24.04' }}
    timeout-minutes: 360
    env:
      PREMERGE_HOST: ${{ inputs.host }}
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      CONFIG: Debug
      JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      DN2CPP_PREMERGE_DIRNAME: dn2cpp-premerge-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Initialize pre-merge evidence
        id: evidence
        run: |
          set -euo pipefail
          DN2CPP_PREMERGE_LOGROOT="$RUNNER_TEMP/$DN2CPP_PREMERGE_DIRNAME"
          if command -v cygpath >/dev/null 2>&1; then
            DN2CPP_PREMERGE_LOGROOT=$(cygpath -m "$DN2CPP_PREMERGE_LOGROOT")
          fi
          printf 'DN2CPP_PREMERGE_LOGROOT=%s\n' "$DN2CPP_PREMERGE_LOGROOT" >> "$GITHUB_ENV"
          test ! -e "$DN2CPP_PREMERGE_LOGROOT"
          mkdir -p "$DN2CPP_PREMERGE_LOGROOT/tmp"
          exec 3>&1 4>&2
          trap 'rc=$?; exec 1>&3 2>&4; printf "%s\n" "$rc" > "$DN2CPP_PREMERGE_LOGROOT/initialize.exit"; cat "$DN2CPP_PREMERGE_LOGROOT/initialize.stdout"; cat "$DN2CPP_PREMERGE_LOGROOT/initialize.stderr" >&2; exit "$rc"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          exec > "$DN2CPP_PREMERGE_LOGROOT/initialize.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/initialize.stderr"
          printf 'expected_head=%s\nevent_sha=%s\nref=%s\nrun_id=%s\nattempt=%s\nhost=%s\n' \
            "$EXPECTED_HEAD" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$PREMERGE_HOST" \
            > "$DN2CPP_PREMERGE_LOGROOT/dispatch.txt"
          date -u +%FT%TZ
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          case "$PREMERGE_HOST" in linux|macos|windows) ;; *) exit 1 ;; esac
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_head must be a full lowercase commit SHA" >&2; exit 1;
          }
          [[ "$EXPECTED_HEAD" == "$GITHUB_SHA" ]] || {
            echo "expected_head does not match the dispatched workflow commit" >&2; exit 1;
          }
          printf 'TMPDIR=%s/tmp\n' "$DN2CPP_PREMERGE_LOGROOT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        id: identity
        run: bash gates/ci-premerge.sh identity

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Install isolated exact CI SDK
        id: sdk
        run: bash gates/ci-premerge.sh capture sdk python gates/setup-culture-reference.py --profile ci

      - name: Provision selected host prerequisites
        id: prerequisites
        run: bash gates/ci-premerge.sh capture setup bash "gates/setup-$PREMERGE_HOST-premerge.sh"

      - name: Run strict Debug non-Godot pre-merge
        id: premerge
        timeout-minutes: 330
        run: bash gates/ci-premerge.sh run

      # Windows build servers can retain evidence file handles after a gate ends.
      - name: Shut down dotnet build servers
        if: always() && runner.os == 'Windows' && steps.sdk.outcome == 'success'
        timeout-minutes: 2
        run: dotnet build-server shutdown

      - name: Record pre-merge outcome
        if: always()
        env:
          INIT_OUTCOME: ${{ steps.evidence.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          SETUP_OUTCOME: ${{ steps.prerequisites.outcome }}
          PREMERGE_OUTCOME: ${{ steps.premerge.outcome }}
        run: |
          export DN2CPP_PREMERGE_LOGROOT="${DN2CPP_PREMERGE_LOGROOT:-$RUNNER_TEMP/$DN2CPP_PREMERGE_DIRNAME}"
          if command -v cygpath >/dev/null 2>&1; then
            export DN2CPP_PREMERGE_LOGROOT="$(cygpath -m "$DN2CPP_PREMERGE_LOGROOT")"
          fi
          mkdir -p "$DN2CPP_PREMERGE_LOGROOT"
          printf 'initialize=%s\ncheckout=%s\nidentity=%s\npython=%s\nsdk=%s\nsetup=%s\npremerge=%s\n' \
            "$INIT_OUTCOME" "$CHECKOUT_OUTCOME" "$IDENTITY_OUTCOME" "$PYTHON_OUTCOME" \
            "$SDK_OUTCOME" "$SETUP_OUTCOME" "$PREMERGE_OUTCOME" \
            > "$DN2CPP_PREMERGE_LOGROOT/step-outcomes.txt"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$DN2CPP_PREMERGE_LOGROOT/disk-final.log"
          {
            printf '## %s Debug pre-merge (--skip-godot)\n\n' "$PREMERGE_HOST"
            printf 'Expected commit: `%s`\n\n' "$EXPECTED_HEAD"
            cat "$DN2CPP_PREMERGE_LOGROOT/step-outcomes.txt"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CHECKOUT_OUTCOME" = success ]; then
            bash gates/ci-premerge.sh outcome
          else
            echo 'No checked-out source or completed pre-merge receipt; this is not a pass.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload complete pre-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.host }}-premerge-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ env.DN2CPP_PREMERGE_DIRNAME }}
            artifacts/**/*.stdout
            artifacts/**/*.stderr
            artifacts/**/*.status
            artifacts/**/*.exit
            artifacts/**/*.command
            artifacts/**/native.out
            artifacts/**/oracle.out
            artifacts/**/expected.out
            artifacts/**/dotnet.out
            artifacts/**/*-native.out
            artifacts/**/*-dotnet.out
            artifacts/**/*.raw.out
            artifacts/**/*.err
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
