# Hosted checks run basic regressions per change and the wider suite daily.
name: linux-smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Manual verification scope
        type: choice
        options: [suite, premerge-debug]
        default: suite
      expected_head:
        description: Full commit SHA required for premerge-debug
        type: string
        default: ""

concurrency:
  group: linux-smoke-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'fast' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'premerge-debug' && 'premerge-debug' || 'suite') }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  GODOT_VERSION: 4.7.2-stable
  # Keep Linux native builds on the same compiler family as macOS.
  CC: clang
  CXX: clang++
  LOGDIR: /tmp/dn2cpp-ci-smoke

jobs:
  smoke:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'premerge-debug'
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'premerge-debug' && 'linux-suite-not-selected' || matrix.partition == 'suite' && 'linux-suite' || matrix.partition == 'limits' && 'linux-transpiler-limits' || matrix.partition == 'arrays' && 'linux-arrays' || 'linux-primitives' }}
    strategy:
      fail-fast: false
      matrix:
        partition: ${{ fromJSON((github.event_name == 'pull_request' || github.event_name == 'push') && '["core","arrays","limits"]' || '["suite"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (matrix.partition == 'core' && 60 || 30) || 180 }}
    env:
      SMOKE_PROFILE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 'primitives' || 'suite' }}
    steps:
      - name: Validate manual mode
        if: github.event_name == 'workflow_dispatch'
        env:
          MANUAL_MODE: ${{ inputs.mode }}
        run: |
          case "$MANUAL_MODE" in
            ''|suite) ;;
            *) echo "Unsupported manual mode: $MANUAL_MODE" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # setup-dotnet also installs latest LTS runtime, defeating the oracle pin.
      - name: Install isolated exact culture reference SDK
        run: python gates/setup-culture-reference.py

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang cmake
          if [ "$SMOKE_PROFILE" = suite ]; then
            sudo apt-get install -y --no-install-recommends ccache unzip
          fi

      # GodotSharpShim needs extension_api.json even when Godot gates are omitted.
      - name: Provision Godot ${{ env.GODOT_VERSION }}
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          asset="Godot_v${GODOT_VERSION}_linux.x86_64"
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${asset}.zip"
          curl -fL --retry 3 -o /tmp/godot.zip "$url"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/${asset}" /usr/local/bin/godot
          godot --headless --version

      - name: Dump extension_api.json
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: godot --headless --dump-extension-api

      - name: Verify smoke runner
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: ./gates/ci-smoke.sh --self-test

      - name: Run selected smoke profile
        env:
          DN2CPP_GATE_WATCHDOG_SECS: ${{ matrix.partition == 'limits' && 1200 || '' }}
        run: |
          export TMPDIR="$RUNNER_TEMP/dn2cpp-gate-output"
          mkdir -p "$TMPDIR"
          smoke_args=(--profile "$SMOKE_PROFILE")
          if [ "$SMOKE_PROFILE" = primitives ]; then
            smoke_args+=(--partition "${{ matrix.partition }}")
          fi
          ./gates/ci-smoke.sh "${smoke_args[@]}"

      - name: Publish gate results and timings
        if: always()
        run: |
          if [ -f "$LOGDIR/summary.md" ]; then
            cat "$LOGDIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.partition == 'suite' && 'gate-logs-linux' || format('gate-logs-linux-{0}', matrix.partition) }}
          path: ${{ env.LOGDIR }}
          retention-days: 7
          if-no-files-found: warn

      # Keep byte evidence, not generated sources, build trees or executables.
      - name: Upload failed gate output evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-output-linux-${{ matrix.partition }}
          path: |
            artifacts/**/*.stdout
            artifacts/**/*.stderr
            artifacts/**/*.status
            artifacts/**/*.exit
            artifacts/**/*.command
            artifacts/**/native.out
            artifacts/**/oracle.out
            artifacts/**/expected.out
            artifacts/**/dotnet.out
            artifacts/**/*-native.out
            artifacts/**/*-dotnet.out
            artifacts/**/*.raw.out
            artifacts/**/*.err
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.stdout
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.stderr
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.status
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.exit
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.command
            ${{ runner.temp }}/dn2cpp-gate-output/**/native.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/oracle.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/expected.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/dotnet.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*-native.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*-dotnet.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.raw.out
            ${{ runner.temp }}/dn2cpp-gate-output/**/*.err
          retention-days: 7
          if-no-files-found: warn


  premerge-debug:
    name: linux-premerge-debug
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'premerge-debug'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
      CONFIG: Debug
      JOBS: "2"
      CMAKE_BUILD_PARALLEL_LEVEL: "2"
      DN2CPP_PREMERGE_LOGROOT: /tmp/dn2cpp-premerge-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    steps:
      - name: Initialize pre-merge evidence
        id: evidence
        run: |
          set -euo pipefail
          test ! -e "$DN2CPP_PREMERGE_LOGROOT"
          mkdir -p "$DN2CPP_PREMERGE_LOGROOT/tmp"
          exec 3>&1 4>&2
          trap 'rc=$?; exec 1>&3 2>&4; printf "%s\n" "$rc" > "$DN2CPP_PREMERGE_LOGROOT/initialize.exit"; cat "$DN2CPP_PREMERGE_LOGROOT/initialize.stdout"; cat "$DN2CPP_PREMERGE_LOGROOT/initialize.stderr" >&2; exit "$rc"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          exec > "$DN2CPP_PREMERGE_LOGROOT/initialize.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/initialize.stderr"
          printf 'expected_head=%s\nevent_sha=%s\nref=%s\nrun_id=%s\nattempt=%s\n' \
            "$EXPECTED_HEAD" "$GITHUB_SHA" "$GITHUB_REF" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$DN2CPP_PREMERGE_LOGROOT/dispatch.txt"
          date -u +%FT%TZ
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_head must be a full lowercase commit SHA" >&2; exit 1;
          }
          [[ "$EXPECTED_HEAD" == "$GITHUB_SHA" ]] || {
            echo "expected_head does not match the dispatched workflow commit" >&2; exit 1;
          }
          printf 'TMPDIR=%s/tmp\n' "$DN2CPP_PREMERGE_LOGROOT" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false

      - name: Verify checked-out commit
        id: identity
        run: |
          set -euo pipefail
          exec 3>&1 4>&2
          trap 'rc=$?; exec 1>&3 2>&4; printf "%s\n" "$rc" > "$DN2CPP_PREMERGE_LOGROOT/identity.exit"; cat "$DN2CPP_PREMERGE_LOGROOT/identity.stdout"; cat "$DN2CPP_PREMERGE_LOGROOT/identity.stderr" >&2; exit "$rc"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          exec > "$DN2CPP_PREMERGE_LOGROOT/identity.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/identity.stderr"
          head=$(git rev-parse HEAD)
          git rev-parse HEAD HEAD^{tree} > "$DN2CPP_PREMERGE_LOGROOT/source-identity.txt"
          [[ "$head" == "$EXPECTED_HEAD" && "$head" == "$GITHUB_SHA" ]] || {
            echo "checkout, expected_head and dispatched workflow commit differ" >&2; exit 1;
          }
          test -z "$(git status --porcelain=v1)"

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Install isolated exact reference SDK
        id: sdk
        run: |
          set -euo pipefail
          exec 3>&1 4>&2
          trap 'rc=$?; exec 1>&3 2>&4; printf "%s\n" "$rc" > "$DN2CPP_PREMERGE_LOGROOT/sdk.exit"; cat "$DN2CPP_PREMERGE_LOGROOT/sdk.stdout"; cat "$DN2CPP_PREMERGE_LOGROOT/sdk.stderr" >&2; exit "$rc"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python gates/setup-culture-reference.py > "$DN2CPP_PREMERGE_LOGROOT/sdk.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/sdk.stderr" 3>&- 4>&-

      - name: Provision selected Linux prerequisites
        id: prerequisites
        run: |
          set -euo pipefail
          exec 3>&1 4>&2
          trap 'rc=$?; exec 1>&3 2>&4; printf "%s\n" "$rc" > "$DN2CPP_PREMERGE_LOGROOT/setup.exit"; cat "$DN2CPP_PREMERGE_LOGROOT/setup.stdout"; cat "$DN2CPP_PREMERGE_LOGROOT/setup.stderr" >&2; exit "$rc"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bash gates/setup-linux-premerge.sh > "$DN2CPP_PREMERGE_LOGROOT/setup.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/setup.stderr" 3>&- 4>&-

      - name: Run strict Debug non-Godot pre-merge
        id: premerge
        timeout-minutes: 330
        run: |
          set -euo pipefail
          exec 3>&1 4>&2
          exec > "$DN2CPP_PREMERGE_LOGROOT/premerge.stdout" 2> "$DN2CPP_PREMERGE_LOGROOT/premerge.stderr"
          disk_pid=
          finish() {
            rc=$?
            trap - EXIT
            if [ -n "$disk_pid" ]; then
              kill "$disk_pid" 2>/dev/null || true
              wait "$disk_pid" 2>/dev/null || true
            fi
            printf '%s\n' "$rc" > "$DN2CPP_PREMERGE_LOGROOT/premerge.exit"
            date -u +%FT%TZ > "$DN2CPP_PREMERGE_LOGROOT/premerge.finished"
            exec 1>&3 2>&4
            cat "$DN2CPP_PREMERGE_LOGROOT/premerge.stdout"
            cat "$DN2CPP_PREMERGE_LOGROOT/premerge.stderr" >&2
            exit "$rc"
          }
          trap finish EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" && "$EXPECTED_HEAD" == "$GITHUB_SHA" ]]
          test -z "$(git status --porcelain=v1)"
          (
            trap - EXIT INT TERM
            sleep_pid=
            trap 'if [ -n "$sleep_pid" ]; then kill "$sleep_pid" 2>/dev/null || true; wait "$sleep_pid" 2>/dev/null || true; fi; exit 0' INT TERM
            while :; do
              date -u +%FT%TZ
              df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
              # The files are authoritative; this bounded preview keeps the live log useful.
              tail -n 8 "$DN2CPP_PREMERGE_LOGROOT/premerge.stdout" >&3
              sleep 60 3>&- 4>&- &
              sleep_pid=$!
              wait "$sleep_pid"
            done
          ) > "$DN2CPP_PREMERGE_LOGROOT/disk-periodic.log" 2>&1 &
          disk_pid=$!
          date -u +%FT%TZ > "$DN2CPP_PREMERGE_LOGROOT/premerge.started"
          printf '%s\n' 'CONFIG=Debug JOBS=2 CMAKE_BUILD_PARALLEL_LEVEL=2 bash gates/pre-merge.sh --skip-godot' \
            > "$DN2CPP_PREMERGE_LOGROOT/premerge.command"
          bash gates/pre-merge.sh --skip-godot 3>&- 4>&-

      - name: Record pre-merge outcome
        if: always()
        env:
          INIT_OUTCOME: ${{ steps.evidence.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          SETUP_OUTCOME: ${{ steps.prerequisites.outcome }}
          PREMERGE_OUTCOME: ${{ steps.premerge.outcome }}
        run: |
          mkdir -p "$DN2CPP_PREMERGE_LOGROOT"
          printf 'initialize=%s\ncheckout=%s\nidentity=%s\npython=%s\nsdk=%s\nsetup=%s\npremerge=%s\n' \
            "$INIT_OUTCOME" "$CHECKOUT_OUTCOME" "$IDENTITY_OUTCOME" "$PYTHON_OUTCOME" \
            "$SDK_OUTCOME" "$SETUP_OUTCOME" "$PREMERGE_OUTCOME" \
            > "$DN2CPP_PREMERGE_LOGROOT/step-outcomes.txt"
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" > "$DN2CPP_PREMERGE_LOGROOT/disk-final.log"
          valid_receipt=0
          if [ "$PREMERGE_OUTCOME" = success ]; then
            receipt="$DN2CPP_PREMERGE_LOGROOT/_receipt.txt"
            short_head=$(git rev-parse --short HEAD)
            if [ "$(git rev-parse HEAD)" = "$EXPECTED_HEAD" ] \
                && [ "$(cat "$DN2CPP_PREMERGE_LOGROOT/premerge.exit" 2>/dev/null)" = 0 ] \
                && [ -s "$receipt" ] \
                && grep -Fxq 'dn2cpp NON-GODOT PRE-MERGE PASSED' "$receipt" \
                && grep -Fxq 'configs: Debug' "$receipt" \
                && awk -v sha="$short_head" '$1 == "commit:" && $NF == sha { found=1 } END { exit !found }' "$receipt"; then
              valid_receipt=1
            fi
          fi
          {
            echo '## Linux Debug pre-merge (--skip-godot)'
            printf 'Expected commit: `%s`\n\n' "$EXPECTED_HEAD"
            cat "$DN2CPP_PREMERGE_LOGROOT/step-outcomes.txt"
            if [ "$valid_receipt" = 1 ]; then
              cat "$DN2CPP_PREMERGE_LOGROOT/_receipt.txt"
            else
              echo 'No completed, valid pre-merge receipt; this is not a pass.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$PREMERGE_OUTCOME" = success ] && [ "$valid_receipt" != 1 ]; then
            echo 'error: successful step lacks the matching Debug non-Godot receipt' \
              | tee "$DN2CPP_PREMERGE_LOGROOT/receipt-validation-error.txt" >&2
            exit 1
          fi

      - name: Upload complete pre-merge evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-premerge-debug-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DN2CPP_PREMERGE_LOGROOT }}
            artifacts/**/*.stdout
            artifacts/**/*.stderr
            artifacts/**/*.status
            artifacts/**/*.exit
            artifacts/**/*.command
            artifacts/**/native.out
            artifacts/**/oracle.out
            artifacts/**/expected.out
            artifacts/**/dotnet.out
            artifacts/**/*-native.out
            artifacts/**/*-dotnet.out
            artifacts/**/*.raw.out
            artifacts/**/*.err
          compression-level: 0
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
